<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REMIT — popped-out view</title>
  <script>
    // Same ES5-safe global fault surface as index.html — a popped-out window
    // must never fail silently either.
    (function () {
      function fault(msg) {
        var el = document.getElementById('fault');
        if (!el) { document.addEventListener('DOMContentLoaded', function () { fault(msg); }); return; }
        el.hidden = false;
        el.textContent = '⚠ ' + msg + ' — please screenshot this and report it.';
      }
      window.__remitFault = fault;
      window.addEventListener('error', function (e) {
        fault((e.message || 'script error')
          + (e.filename ? ' [' + String(e.filename).split('/').pop() + ':' + e.lineno + ']' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason || {};
        fault(r.message ? r.message : String(e.reason));
      });
    })();
  </script>
  <script type="module" crossorigin src="./assets/popout-BC7bk994.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/roles-BKwiJyXP.js">
  <link rel="stylesheet" crossorigin href="./assets/roles-DsHinJM8.css">
</head>
<body class="popout-body">
  <div id="fault" class="fault" hidden></div>
  <main id="popout-root" class="popout-root" data-testid="popout-root"></main>
</body>
</html>

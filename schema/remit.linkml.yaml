id: https://deepbluecltd.github.io/REMIT/schema/remit
name: remit
title: REMIT — v1 Data Model
description: >-
  The serialisable object core of REMIT's v1 mission-planning model — the
  shapes mission planning is built from. This LinkML schema is the Doc-owned
  source of truth (DEC-57): one schema generates JSON Schema, TypeScript types,
  and this hyperlinked reference + ER diagrams. `docs/remit-data-model.md` is the
  prose spine; the field names and structures here are reconciled against the
  objects the walking-skeleton app actually constructs (`app/js/**`), so the
  schema agrees with the running code.


  Three universal rules hold across the model: (1) versioned objects are
  immutable — a change is a new version with lineage, never a mutation
  (DEC-5/7/18); (2) everything decided is attributed — a role-hat, author and
  time on every committing act (DEC-15, NF2); (3) identity is content — an
  immutable object's id is the hash of its canonical serialisation, names are
  aliases, lineage is hash-linked (DEC-35, NF8).


  Scope boundary (DEC-57): LinkML models *data, not behaviour*. Function-valued
  fields — `Channel.values = f(cell,t)`, `MovementModel.cost_speed`,
  `Aspect.value = f(t)` — and the §B/§D service endpoints are resolved across the
  seam (OpenAPI later) and are described here but not modelled as data slots.


  Skeleton reconciliation: where the walking skeleton diverges from the prose
  model the schema follows the *code* and notes the divergence in the relevant
  class. Classes the skeleton does not yet build (MovementModel, Excursion,
  ChannelDelta, Effect, AOPackage, Waiver, Replan) are modelled from the doc and
  flagged "not yet implemented in v1".

license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  remit: https://deepbluecltd.github.io/REMIT/schema/remit/
default_prefix: remit
default_range: string
imports:
  - linkml:types

# =====================================================================
# Enums — the literal unions used across the model
# =====================================================================
enums:
  Criticality:
    description: "Whether a commitment must hold or is best-effort (DEC-22)."
    permissible_values:
      hard:
        description: "must hold"
      soft:
        description: "best-effort; carries a priority, with authority from provenance"

  ActivityType:
    description: "The verb of an activity (DEC-16); v1 set, pluggable registry (NF7)."
    permissible_values:
      visit: {}
      loiter: {}
      avoid: {}
      transit: {}
      maintain: {}

  CommitmentState:
    description: "The lifecycle state of a commitment (B4). `at-risk` is live-only (E2) and not stored."
    permissible_values:
      proposed: {}
      negotiated: {}
      committed: {}
      satisfied: {}
      violated: {}
      waived: {}
      superseded: {}

  AnswerStatus:
    permissible_values:
      confirmed:
        description: "answered by the operator"
      defaulted:
        description: "filled from a stamped default"

  AmbiguityStatus:
    permissible_values:
      open: {}
      resolved: {}

  Domain:
    description: "The medium a baseline / profile / movement model operates in (DEC-20)."
    permissible_values:
      land: {}
      sea: {}
      air: {}

  Terrain:
    description: "Per-cell land-cover class used by the skeleton's mobility raster."
    permissible_values:
      road: {}
      track: {}
      open: {}
      rough: {}
      forest: {}
      marsh: {}
      ford: {}
      water: {}

  Realisation:
    description: "How a channel or movement model is realised (DEC-49). `provider` = a computed service behind the seam."
    permissible_values:
      raster: {}
      analytic: {}
      parametric: {}
      provider: {}

  Predictability:
    description: "How predictable a channel is over time (DEC-21) — drives sampling."
    permissible_values:
      static: {}
      periodic: {}
      dynamic: {}

  ConfidenceLevel:
    permissible_values:
      high: {}
      medium: {}
      low: {}

  # NOTE: the entity-kind / data-provenance values include the literal "self"
  # (own force). LinkML can't carry a permissible value named `self` — the
  # loader (jsonasobj2) reserves it — so `Entity.kind` and `DataProvenance.kind`
  # are modelled as documented strings rather than enums, to keep the real wire
  # value `self`. See docs/project_notes/bugs.md.

  AspectType:
    description: "The render-class of one time-varying facet of an entity (DEC-52/53)."
    permissible_values:
      cell:
        description: "a position → map glyph / distance-along-track"
      scalar:
        description: "a numeric value → a line (altitude, fuel, distance)"
      window:
        description: "a time interval → a band"
      status:
        description: "an up/down or phase value → ticks"

  StrategyKey:
    description: "The skeleton's three candidate strategies (the \"handful\" of plans)."
    permissible_values:
      direct:
        description: "fastest by time/speed"
      tracked:
        description: "keeps to tracked/road surfaces"
      covered:
        description: "favours exposure-reducing cover"

  Band:
    description: "A coarse three-level qualitative band for cost / robustness (C2/C6, NF10)."
    permissible_values:
      robust: {}
      marginal: {}
      fragile: {}

  MarginBand:
    description: "The slack band on a single commitment's satisfaction (A2, NF10). `crossed` = violated."
    permissible_values:
      robust: {}
      marginal: {}
      tight: {}
      crossed: {}

  Verdict:
    description: "A commitment's verdict in a plan's scores."
    permissible_values:
      satisfied: {}
      violated: {}
      waived: {}

  ScheduleLegKind:
    description: "The kind of one leg in a plan's schedule."
    permissible_values:
      transit: {}
      hold:
        description: "a wait — e.g. \"await low-tide window\" at a tidal ford"
      visit: {}
      exfil: {}

  TideMode:
    description: "The outcome of the tidal-ford wait-vs-detour weighing (ADR-0006)."
    permissible_values:
      no-ford:
        description: "no tidal ford on the route"
      open:
        description: "ford open at the bank — cross now"
      wait:
        description: "hold at the bank for the low-tide window, then cross"
      detour:
        description: "ford-free detour reaches the RV sooner"

  ConflictKind:
    description: "Whether a clash is built into the request or emerges from the schedule (C1)."
    permissible_values:
      structural:
        description: "e.g. no route exists"
      emergent:
        description: "e.g. the schedule is infeasible"

  AlertCauseType:
    description: "Why the wingman raised an execution alert (E3)."
    permissible_values:
      hard_infeasible: {}
      band_crossing: {}
      tide_reassessment:
        description: "a re-plan changed the tide decision's mode (ADR-0007)"

  LogEntryKind:
    permissible_values:
      Alert: {}
      Observation: {}
      Waiver: {}
      Replan: {}

# =====================================================================
# Classes
# =====================================================================
classes:

  # ---- shared value objects -------------------------------------------------
  Attribution:
    description: >-
      Who decided, under what authority, when. Stamped on every committing act —
      this is universal rule 2 (DEC-15, NF2).
    attributes:
      issuing_role:
        description: "the role-hat the author wore"
      authority:
        description: "the authority the act was taken under"
      by:
        description: "the author"
      at:
        description: "ISO timestamp of the act"
        range: datetime

  DataProvenance:
    description: "The source and trust of a datum or entity (DEC-19). Trivial defaults in v1."
    attributes:
      kind:
        description: "source-class — one of: self, planned, forecast, observed, provider. The prose model separates entity kind (self/actor/feature/phenomenon) from data provenance (planned/forecast/observed); the skeleton folds them, using self/forecast/provider. A documented string rather than an enum (see the AspectType note)."
        required: true
      confidence:
        range: ConfidenceLevel
      freshness:
        description: "how recent — e.g. \"provisioned\""

  CommitmentProvenance:
    description: "A commitment's ownership and waiver authority (B3)."
    attributes:
      issuing_role: {}
      authority: {}
      owner: {}
      waiver_authority:
        description: "who may waive this commitment"
      expiry:
        range: datetime
      rationale: {}

  # ---- 1. Requirement, and the promises in it -------------------------------
  Requirement:
    description: >-
      The command's narrative intent, owned as a versioned immutable object
      (DEC-5/18). Amend it and you get a new version with lineage — the original
      stands. Content-addressed: its id is the hash of its canonical form.
    attributes:
      id:
        identifier: true
        description: "content id (sha256:…) of the canonical form (DEC-35)"
      version:
        range: integer
        description: "amendment → new version (B5)"
      intent:
        required: true
        description: "the command's narrative, in their words"
      provenance:
        range: Attribution
        inlined: true
        description: "issuing role/authority + time"
      commitments:
        range: Commitment
        multivalued: true
        inlined_as_list: true
        description: "the promises it decomposes into"
      lineage:
        range: Lineage
        inlined: true

  Lineage:
    description: "Hash-link back to the version this one supersedes (universal rule 1)."
    attributes:
      previous_version:
        description: "id of the prior Requirement version"
      amending_order_ref:
        description: "reference to the amending order, if any"

  Commitment:
    description: >-
      One thing the plan must achieve (DEC-16/17/22). Either hard (must hold) or
      soft with a priority. Carries the negotiated contract text and any
      unresolved ambiguities, and walks a lifecycle of states.
    attributes:
      id:
        identifier: true
        description: "e.g. \"cmt-1\""
      activity:
        range: Activity
        inlined: true
        required: true
      criticality:
        range: Criticality
        required: true
      provenance:
        range: CommitmentProvenance
        inlined: true
      capture:
        range: Capture
        inlined: true
        description: "the negotiated contract record (DEC-17)"
      state:
        range: CommitmentState

  Capture:
    description: "The negotiation record behind a commitment — answers, the canonical contract text, open ambiguities (DEC-17)."
    attributes:
      answers:
        range: Answer
        multivalued: true
        inlined_as_list: true
      echo_back:
        description: "the canonical contract text read back to the operator"
      ambiguities:
        range: Ambiguity
        multivalued: true
        inlined_as_list: true
        description: "resolvable-later"

  Answer:
    attributes:
      slot:
        description: "which question slot"
      value: {}
      status:
        range: AnswerStatus
      by: {}
      at:
        range: datetime

  Ambiguity:
    attributes:
      question: {}
      status:
        range: AmbiguityStatus
      consequence:
        description: "what hinges on resolving it"

  Activity:
    description: >-
      The verb of a commitment — visit, loiter, avoid, transit, maintain
      (DEC-16/21). `where` is a Waypoint or a boolean predicate over map cells
      (DEC-33); `when` is a window, before/after, or recurring. Always inlined in
      its Commitment (no independent identity).
    attributes:
      type:
        range: ActivityType
        required: true
      where:
        range: Waypoint
        inlined: true
        description: "the location — a map cell (skeleton uses {x, y, alias})"
      where_predicate:
        range: CellPredicate
        inlined: true
        description: "alternative to `where` — a boolean predicate tree over cells (DEC-33)"
      when:
        range: TimingConstraint
        inlined: true
      duration:
        range: DurationBound
        inlined: true
      modifiers:
        range: ActivityModifiers
        inlined: true
      effects:
        range: Effect
        multivalued: true
        inlined_as_list: true
        description: "\"v1: self-state delta / persistent marker (always empty in the skeleton)\""
      outcome_model:
        description: "\"v1: boolean | duration; pluggable (probabilistic = H3)\""
      relevant_channels:
        range: Channel
        multivalued: true
        inlined: false
        description: "channel ids to sample / trigger on (DEC-21)"

  Waypoint:
    description: "A single grid location."
    attributes:
      x:
        range: integer
        required: true
      y:
        range: integer
        required: true
      alias:
        description: "a human-friendly name, e.g. \"OP-21,3\""

  CellPredicate:
    description: >-
      A boolean tree over map cells (DEC-33): an atom, or and/or/not of
      sub-predicates. Atoms are a pluggable registry (land-cover, elevation,
      slope, static-LOS, near(feature, dist)). Conceptual — the skeleton uses
      Waypoints only.
    attributes:
      op:
        description: "\"atom | and | or | not\""
      atom:
        description: "the atom name when op = atom (e.g. land-cover, slope)"
      params:
        description: "atom parameters"
      children:
        range: CellPredicate
        multivalued: true
        inlined_as_list: true
        description: "sub-predicates for and/or/not"

  TimingConstraint:
    description: "When an activity must happen — exactly one form is used (DEC-16)."
    attributes:
      window:
        range: TimeWindow
        inlined: true
        description: "an absolute or anchored interval"
      before_min:
        range: integer
        description: "deadline, in mission minutes"
      after_min:
        range: integer
        description: "earliest start, in mission minutes"
      recurring:
        description: "\"recurring(period, anchor) — conceptual\""

  TimeWindow:
    attributes:
      start_min:
        range: integer
      end_min:
        range: integer

  DurationBound:
    attributes:
      min_min:
        range: integer
        description: "minimum dwell, in minutes"
      max_min:
        range: integer

  ActivityModifiers:
    attributes:
      stationary:
        range: boolean
      be_at_role:
        description: "\"entry | exit | visit\""
      after:
        description: "sequencing — id of a commitment this must follow (e.g. \"cmt-1\")"

  # ---- 2. The world the plan moves through ----------------------------------
  Baseline:
    description: >-
      The world as known truth (DEC-7/20/28): a medium (land/sea/air grid)
      carrying channels and per-cell attributes, plus a single fact layer that
      observations append to. Immutable and versioned; the kernel always
      evaluates baseline ⊕ excursion ⊕ plan-effects-to-date (DEC-19).
    attributes:
      id:
        identifier: true
        description: "content id of the canonical form (DEC-35)"
      name: {}
      version:
        range: integer
      medium:
        range: Medium
        inlined: true
      cells:
        range: Cell
        multivalued: true
        inlined_as_list: true
        description: "the grid cells (skeleton, row-major)"
      channels:
        range: Channel
        multivalued: true
        inlined_as_list: true
      facts:
        range: FactLayer
        inlined: true
        description: "the one truth; observations append here"
      forecast_changepoints:
        range: Changepoint
        multivalued: true
        inlined_as_list: true
        description: "when the world is expected to shift"
      lineage:
        range: Lineage
        inlined: true

  Changepoint:
    description: "A forecast time at which a channel is expected to shift (e.g. a tidal ford opening) (DEC-21)."
    attributes:
      at_min:
        range: integer
        description: "mission minutes"
      channel:
        range: Channel
        inlined: false
        description: "the channel that shifts"
      change:
        description: "what changes, in words"

  Medium:
    description: "The domain, grid and cell-attribute schema of a baseline (DEC-20/28)."
    attributes:
      domain:
        range: Domain
        required: true
      grid:
        range: Grid2D
        inlined: true
      cell_attrs:
        multivalued: true
        description: "the names of the per-cell attributes carried (e.g. mobility, cover)"

  Grid2D:
    attributes:
      w:
        range: integer
        required: true
      h:
        range: integer
        required: true
      cell_m:
        range: integer
        description: "cell edge length, in metres"

  Cell:
    description: "One grid cell's attributes (skeleton mobility raster)."
    attributes:
      terrain:
        range: Terrain
      mobility:
        range: float
        description: "0–1 speed factor (0 = impassable)"
      cover:
        range: float
        description: "0–1 concealment"

  Channel:
    description: >-
      A field over space and time — tide, cloud, risk, mobility (DEC-19/21). Its
      values are conceptually `f(cell, t)`, however realised; that function is
      resolved across the seam (DEC-49) and is *not* a data slot here. For
      parametric/periodic channels the realising parameters (`params`) *are*
      data and are modelled.
    attributes:
      id:
        identifier: true
        description: "e.g. \"tide\", \"mobility\""
      domain_type:
        description: "what the field measures, e.g. \"water_level\", \"speed_factor\""
      realisation:
        range: Realisation
      confidence:
        range: ConfidenceLevel
      freshness: {}
      sampling_step_min:
        range: integer
        description: "sampling cadence (tide coarse, cloud fine) (DEC-21)"
      predictability:
        range: Predictability
      params:
        range: ChannelParams
        inlined: true
        description: "realising parameters for parametric channels"

  ChannelParams:
    description: "Parameters of a parametric/periodic channel — e.g. the skeleton's tidal ford (ADR-0006)."
    attributes:
      period_min:
        range: integer
      low_tide_min:
        range: integer
        description: "first low tide, in mission minutes"
      open_half_width_min:
        range: integer
        description: "±minutes around low tide the ford is wadeable"
      applies_to:
        description: "the cell/feature the params apply to (e.g. the ford alias)"

  FactLayer:
    description: "The single truth layer; observations append here (E5). Collapses excursions and forecast entities over time."
    attributes:
      observations:
        range: Observation
        multivalued: true
        inlined_as_list: true

  MovementModel:
    description: >-
      Per-domain cost of travel, and anisotropic — a property of the edge between
      cells, not the cell (DEC-49/34): slope-along-direction on land, current/wind
      vectors at sea and in air. Its cost function `cost_speed = f(cell→cell, t,
      profile)` is behaviour, resolved across the seam — only `domain` and
      `realisation` are data here. Not yet implemented in the v1 skeleton.
    attributes:
      domain:
        range: Domain
      realisation:
        range: Realisation
        description: "\"parametric(type, params) | provider\""

  Excursion:
    description: >-
      A named, versioned set of deltas layered on a baseline — "what if the
      weather turns?" — without disturbing the underlying truth (DEC-7). Not yet
      implemented in the v1 skeleton.
    attributes:
      id:
        identifier: true
      name: {}
      version:
        range: integer
      base:
        range: Baseline
        inlined: false
        description: "the baseline version it sits on"
      delta:
        range: ChannelDelta
        multivalued: true
        inlined_as_list: true

  ChannelDelta:
    description: >-
      How the world is edited (DEC-34): a parametric delta (time-shift, scale,
      mask) from a pluggable registry, or a raw cell patch (the escape hatch).
      Not yet implemented in the v1 skeleton.
    attributes:
      kind:
        description: "\"parametric | cell_patch\""
      type:
        description: "the parametric delta type (registry) — when kind = parametric"
      params:
        description: "parameters for the parametric delta"
      patches:
        range: CellPatch
        multivalued: true
        inlined_as_list: true
        description: "raw (cell, t, value) patches — when kind = cell_patch"

  CellPatch:
    attributes:
      x:
        range: integer
      y:
        range: integer
      t:
        range: integer
        description: "mission minutes"
      value:
        description: "the patched value"

  Effect:
    description: >-
      A delta a plan's activity applies from a point in time (DEC-19/34) — a
      ChannelDelta or a self-state delta. Referenced from Activity.effects;
      always empty in the v1 skeleton.
    attributes:
      source_plan:
        range: Plan
        inlined: false
      source_activity:
        description: "the activity that applies the effect"
      active_from:
        range: integer
        description: "mission minutes"
      delta:
        range: ChannelDelta
        inlined: true

  AOPackage:
    description: >-
      Everything provisioned for an Area of Operations, packaged ready to plan
      against (DEC-11/12/52). Not yet assembled as one object in the v1 skeleton.
    attributes:
      baseline_versions:
        range: Baseline
        multivalued: true
        inlined: false
      excursions:
        range: Excursion
        multivalued: true
        inlined: false
      profiles:
        range: Profile
        multivalued: true
        inlined: false
      entities:
        range: Entity
        multivalued: true
        inlined: false
        description: "located things to display"

  # ---- 3. Own force ---------------------------------------------------------
  Profile:
    description: >-
      What a platform can do — the fixed capabilities a sensitivity sweep varies
      (DEC-19/20, F5). Immutable and versioned, content-addressed.
    attributes:
      id:
        identifier: true
        description: "content id of the canonical form (DEC-35)"
      name: {}
      version:
        range: integer
      domain:
        range: Domain
      speed_by_medium:
        range: SpeedByMedium
        inlined: true
        description: "how fast, where"
      endurance:
        range: Endurance
        inlined: true
      sensors:
        multivalued: true
        description: "what it can perceive"
      dynamics:
        description: "how it manoeuvres (e.g. \"wheeled\")"

  SpeedByMedium:
    description: "Speed per medium (skeleton: land only)."
    attributes:
      land_kph:
        range: float
      sea_kph:
        range: float
      air_kph:
        range: float

  Endurance:
    attributes:
      fuel_pct:
        range: float
        description: "starting fuel, 0–100"
      hours:
        range: float
        description: "how long it can keep going"

  State:
    description: >-
      The platform right now — the live condition the kernel re-anchors to during
      execution (DEC-19). It is the privileged self-entity (DEC-52): its fields
      are the dynamic aspects of the `self` Entity (position → map/distance;
      endurance/availability → state curves).
    attributes:
      position:
        range: Waypoint
        inlined: true
        description: "which cell"
      clock_min:
        range: integer
        description: "the current mission time, in minutes"
      endurance_fuel_pct:
        range: float
        description: "how much fuel is left, 0–100"
      availability:
        description: "\"available | down\""

  # ---- 4. Entities & projections --------------------------------------------
  Entity:
    description: >-
      Anything located with an identity — yourself, an actor, a feature, a
      phenomenon (DEC-52). Where a Channel is a field, an Entity is a thing,
      projected across synchronised views. To affect the plan it is *cast* to a
      Channel or Commitment (actor → moving risk channel; window → timing
      commitment); in v1 entities are display-only. Skeleton note: aspects are
      keyed by name in an object (phase/fuel/height/pass); modelled here as a list
      of named Aspects.
    attributes:
      id:
        identifier: true
        description: "e.g. \"ent-self\", \"ent-tide\", \"ent-sat\""
      label: {}
      kind:
        description: "conceptual kind (DEC-52) — one of: self, actor, feature, phenomenon. Optional; the skeleton folds this into provenance.kind. A documented string rather than an enum (see the AspectType note)."
      provenance:
        range: DataProvenance
        inlined: true
      aspects:
        range: Aspect
        multivalued: true
        inlined_as_list: true

  Aspect:
    description: >-
      One facet of an entity, over time (DEC-52/53) — its position, an altitude, a
      timing window, an up/down status — rendered onto a shared axis by a view.
      Its value `f(t)` is behaviour, evaluated across the seam, and is not a data
      slot; the render-type, unit and bounds *are* data.
    attributes:
      name:
        identifier: true
        description: "e.g. \"phase\", \"fuel\", \"height\", \"pass\""
      type:
        range: AspectType
        required: true
      unit:
        description: "unit for scalar aspects (e.g. \"%\")"
      domain:
        range: float
        multivalued: true
        description: "\"[min, max] bounds for scalar aspects\""
      channel_ref:
        range: Channel
        inlined: false
        description: "the source channel, if any"

  # ---- 5. Plan identity, and plans ------------------------------------------
  Stamp:
    description: >-
      Every input that determines a plan, bundled into one identity (DEC-23/24/29):
      which requirement, which world, which config core, what appetites and
      steering, which kernel and seed. A plan's id IS the hash of its Stamp, so two
      plans are comparable only when their stamps share a basis (the comparability
      guard). Skeleton additions (DEC-47): `profile_version` and `start` are part of
      identity because the plan depends on the platform and the starting state.
    attributes:
      requirement_version:
        range: Requirement
        inlined: false
        description: "id of the requirement version"
      baseline_version:
        range: Baseline
        inlined: false
        description: "id of the baseline version"
      excursions:
        range: Excursion
        multivalued: true
        inlined: false
        description: "ids of the excursion versions (empty in v1)"
      config_core_hash:
        description: "hash of the world-defining config core — medium/channels/movement-model/providers/vocabulary; the instance shell is excluded (DEC-48)"
      profile_version:
        range: Profile
        inlined: false
        description: "id of the profile version (skeleton addition, DEC-47)"
      start:
        range: StartState
        inlined: true
        description: "the starting state (skeleton addition, DEC-47)"
      appetites:
        range: Appetite
        multivalued: true
        inlined_as_list: true
        description: "the implementer's risk dials (DEC-6)"
      steering:
        range: Constraint
        multivalued: true
        inlined_as_list: true
        description: "interpreted operator gestures / no-go constraints (DEC-24)"
      kernel_version:
        description: "e.g. \"mock-0.1\" — part of identity (DEC-29)"
      strategy_seed:
        range: integer
        description: "RNG seed for strategy ordering — part of identity (DEC-29)"

  StartState:
    description: "The starting position and clock baked into a Stamp (skeleton, DEC-47)."
    attributes:
      x:
        range: integer
      y:
        range: integer
      clock_min:
        range: integer

  Appetite:
    description: "One risk-appetite dial setting (DEC-6) — e.g. tempo = rapid, exposure = cautious."
    attributes:
      axis:
        description: "\"e.g. tempo, exposure\""
      setting:
        description: "\"e.g. deliberate/balanced/rapid, bold/balanced/cautious\""

  Constraint:
    description: "One interpreted operator steering gesture (DEC-24) — e.g. a no-go region."
    attributes:
      type:
        description: "\"e.g. no-go\""
      cells:
        range: Waypoint
        multivalued: true
        inlined_as_list: true

  Strategy:
    description: "One candidate strategy in the plan handful (skeleton)."
    attributes:
      key:
        range: StrategyKey
        required: true
      label: {}
      axis:
        description: "the axis it optimises, e.g. \"time/speed\""
      blurb:
        description: "a one-line description"

  Plan:
    description: >-
      A candidate solution whose id IS the hash of its Stamp (DEC-5/22/29). Its
      materialisation (schedule, trajectory, state curves) is cached and
      regenerable; its scores and first-class conflicts make it comparable. The
      skeleton also carries the chosen `strategy` and the `tide_decision` weighing.
    attributes:
      id:
        identifier: true
        description: "\"= hash(Stamp, strategy)\""
      strategy:
        range: Strategy
        inlined: true
      stamp:
        range: Stamp
        inlined: true
        description: "authoritative — the plan's identity basis"
      materialisation:
        range: Materialisation
        inlined: true
        description: "cached, regenerable; null when infeasible"
      scores:
        range: Scores
        inlined: true
      tide_decision:
        range: TideDecision
        inlined: true
        description: "the exfil wait-vs-detour weighing (ADR-0006); null when no ford"
      conflicts:
        range: Conflict
        multivalued: true
        inlined_as_list: true
        description: "first-class, named clashes (C1)"

  Materialisation:
    description: "The cached, regenerable working-out of a plan; absent when the plan is infeasible."
    attributes:
      schedule:
        range: ScheduleLeg
        multivalued: true
        inlined_as_list: true
      trajectory:
        range: TrajectoryPoint
        multivalued: true
        inlined_as_list: true
      state_curves:
        range: StateCurves
        inlined: true
      tide:
        range: TideDecision
        inlined: true
        description: "the tide decision at plan time"
      verified:
        range: boolean
      kernel_version_verified:
        description: "the kernel version that verified the materialisation"

  ScheduleLeg:
    description: "One leg of a plan's schedule. Exfil legs may carry a tide hold (ADR-0006)."
    attributes:
      kind:
        range: ScheduleLegKind
        required: true
      label: {}
      start_min:
        range: float
      end_min:
        range: float
      commitment_id:
        range: Commitment
        inlined: false
        description: "the commitment this leg serves (visit/exfil legs)"

  TrajectoryPoint:
    description: "One sampled point on the platform's path; coordinates may be fractional, time/fuel rounded to 1 dp for IEEE stability."
    attributes:
      x:
        range: float
      y:
        range: float
      t:
        range: float
        description: "mission minutes"
      fuel_pct:
        range: float

  StateCurves:
    description: "The end-state of the platform's curves over the plan (v1 carries fuel only)."
    attributes:
      fuel_end_pct:
        range: float

  Scores:
    description: "A plan's comparable scores, read under the comparability guard (A2/C2/C6, NF10)."
    attributes:
      satisfaction:
        range: Satisfaction
        multivalued: true
        inlined_as_list: true
      cost_band:
        range: Band
      robustness_band:
        range: Band

  Satisfaction:
    description: "One commitment's verdict and slack within a plan."
    attributes:
      commitment_id:
        range: Commitment
        inlined: false
      label: {}
      margin_min:
        range: float
        description: "slack in minutes; may be negative"
      margin_band:
        range: MarginBand
      verdict:
        range: Verdict

  TideDecision:
    description: >-
      The result of the tidal-ford wait-vs-detour weighing (ADR-0006): the kernel
      materialises the exfil both ways — wait at the bank vs a ford-free detour —
      and commits to the earlier RV arrival, publishing the choice here.
    attributes:
      mode:
        range: TideMode
        required: true
      wait_min:
        range: float
        description: "minutes held at the bank before crossing"
      ford_rv:
        range: float
        description: "mission minutes the ford route reaches the RV"
      detour_rv:
        range: float
        description: "mission minutes the detour route reaches the RV; null when no detour exists"
      narrative:
        description: "the choice, in words"

  Conflict:
    description: >-
      A first-class, named clash when commitments cannot all be kept (C1) — not a
      silent failure.
    attributes:
      id:
        identifier: true
      kind:
        range: ConflictKind
        required: true
      parties:
        range: Commitment
        multivalued: true
        inlined: false
        description: "the commitments in tension"
      narrative:
        description: "what the clash is, in words"

  # ---- 6. The record: why, and what happened --------------------------------
  SelectionRationale:
    description: >-
      The record of a choice (DEC-23): which plan won, which it beat, on which
      axis, with the after-mitigation bands, and who decided. Content-addressed.
    attributes:
      id:
        identifier: true
        description: "content id of the canonical form (DEC-35)"
      chosen:
        range: Plan
        inlined: false
        description: "the winning plan"
      beaten:
        range: Plan
        multivalued: true
        inlined: false
        description: "the field it beat"
      deciding_axis:
        description: "\"what tipped it — e.g. time/speed, exposure, robustness, completeness\""
      note:
        description: "the justification narrative"
      appetites:
        range: Appetite
        multivalued: true
        inlined_as_list: true
        description: "the risk-appetite selections at the time"
      mitigations:
        multivalued: true
        description: "\"e.g. armed-escort\""
      chosen_bands:
        range: ChosenBands
        inlined: true
        description: "cost/robustness bands after mitigations"
      by: {}
      role:
        description: "\"e.g. implementer\""
      at:
        range: datetime

  ChosenBands:
    attributes:
      cost:
        range: Band
      rob:
        range: Band

  ExecutionLog:
    description: >-
      The append-only live history of a mission (DEC-23/25/26): alerts when a band
      is crossed, observations that update truth, waivers, and replans — never
      overwritten. Together with rationales and stamps it gives a complete
      after-action record with perfect replay (F1).
    attributes:
      entries:
        range: LogEntry
        multivalued: true
        inlined_as_list: true

  LogEntry:
    abstract: true
    description: "Base of the append-only execution log; the store stamps each with a `seq`."
    attributes:
      kind:
        range: LogEntryKind
        required: true
      seq:
        range: integer
        description: "0-indexed sequence, stamped on append"
      at:
        range: integer
        description: "mission minutes"

  Alert:
    is_a: LogEntry
    description: "A band crossing or hard-infeasibility raised during execution (E3)."
    attributes:
      cause:
        range: AlertCause
        inlined: true

  AlertCause:
    attributes:
      type:
        range: AlertCauseType
        required: true
      commitment:
        description: "the phased commitment being tracked (e.g. \"observe\", \"exfil\")"
      from:
        description: "the prior band state"
      to:
        description: "the new band state"

  Observation:
    is_a: LogEntry
    description: "A fact delta appended to the baseline's fact layer (E5)."
    attributes:
      fact_delta:
        range: FactDelta
        inlined: true
      source:
        description: "\"e.g. operator\""
      confidence:
        description: "\"e.g. reported\""

  FactDelta:
    attributes:
      note: {}
      tag:
        description: "\"e.g. track-state, sighting, weather\""

  Waiver:
    is_a: LogEntry
    description: "A relaxed commitment, attributed (B3). Not yet logged in the v1 skeleton."
    attributes:
      commitment_id:
        range: Commitment
        inlined: false
      by: {}
      authority: {}
      rationale: {}

  Replan:
    is_a: LogEntry
    description: "A move from one committed plan to another, with rationale (DEC-36). Not yet logged in the v1 skeleton."
    attributes:
      from:
        range: Plan
        inlined: false
      to:
        range: Plan
        inlined: false
      rationale_ref:
        range: SelectionRationale
        inlined: false

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="818" height="288" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2328">Active-feature resolution order</text>

  <!-- tier labels -->
  <text x="107" y="92" font-size="12.5" font-weight="600" fill="#656d76" text-anchor="middle">TIER 1</text>
  <text x="307" y="92" font-size="12.5" font-weight="600" fill="#8250df" text-anchor="middle">TIER 2 · cloud</text>
  <text x="507" y="92" font-size="12.5" font-weight="600" fill="#656d76" text-anchor="middle">TIER 3</text>
  <text x="707" y="92" font-size="12.5" font-weight="600" fill="#656d76" text-anchor="middle">ELSE</text>

  <!-- Box 1 -->
  <rect x="20" y="104" width="175" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="107" y="148" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">SPECIFY_FEATURE</text>
  <text x="107" y="172" font-size="13" fill="#656d76" text-anchor="middle">env var</text>

  <!-- Box 2 (highlighted) -->
  <rect x="220" y="104" width="175" height="96" rx="10" fill="#faf2ff" stroke="#8250df" stroke-width="2"/>
  <text x="307" y="143" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">.specify/</text>
  <text x="307" y="161" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">.active-feature</text>
  <text x="307" y="183" font-size="12.5" fill="#8250df" text-anchor="middle">file · gitignored</text>

  <!-- Box 3 -->
  <rect x="420" y="104" width="175" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="507" y="148" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">branch NNN- token</text>
  <text x="507" y="172" font-size="13" fill="#656d76" text-anchor="middle">e.g. 220-fix-foo</text>

  <!-- Box 4 -->
  <rect x="620" y="104" width="175" height="96" rx="10" fill="#fff8f0" stroke="#d4a72c"/>
  <text x="707" y="148" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">recovery hint</text>
  <text x="707" y="172" font-size="13" fill="#656d76" text-anchor="middle">lists available specs</text>

  <!-- arrows -->
  <g fill="#57606a">
    <path d="M198 152 l16 0 m-6 -5 l6 5 l-6 5" stroke="#57606a" stroke-width="2" fill="none"/>
    <path d="M398 152 l16 0 m-6 -5 l6 5 l-6 5" stroke="#57606a" stroke-width="2" fill="none"/>
    <path d="M598 152 l16 0 m-6 -5 l6 5 l-6 5" stroke="#57606a" stroke-width="2" fill="none"/>
  </g>

  <text x="40" y="246" font-size="12.5" fill="#656d76">Each tier is tried in turn; the first that resolves wins. Tiers 1 and 3 are spec-kit's; tier 2 and the hint are the REMIT additions.</text>
  <text x="40" y="268" font-size="12.5" fill="#656d76">Cloud branches like claude/&lt;topic&gt;-&lt;random&gt; carry no NNN- token, so tier 2 (the file) is how you select a spec.</text>
</svg>

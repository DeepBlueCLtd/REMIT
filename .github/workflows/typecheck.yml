name: typecheck

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit over the JSDoc-typed app (checkJs + strict). The app stays
      # plain ES-module JavaScript — this enforces the // @ts-check that every
      # app/js file already declares, so type drift fails the build.
      - name: Type-check
        run: npm run typecheck
